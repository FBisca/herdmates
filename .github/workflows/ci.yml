name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Issue #127: cross-compare the subcommand seams (dispatch arms vs help
      # text vs plugin manifest). Both drifted for real during the v3.0.0 wave.
      - run: bash scripts/check-subcommand-seams.sh
